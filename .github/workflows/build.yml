name: NeoForge Build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        integration:
          - name: player-bridge
            working-directory: .
            artifact-path: build/libs/*.jar
          - name: permission-integration
            working-directory: mods/ivrm-permission-integration
            artifact-path: mods/ivrm-permission-integration/build/libs/*.jar

    name: Build ${{ matrix.integration.name }}

    steps:
      - name: ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 25をセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 9.2.1をセットアップ
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic

      - name: ビルド
        working-directory: ${{ matrix.integration.working-directory }}
        run: gradle --no-daemon clean build

      - name: ビルド成果物を保存
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ivrm-${{ matrix.integration.name }}-${{ github.sha }}
          path: ${{ matrix.integration.artifact-path }}
          if-no-files-found: error
          retention-days: 14
