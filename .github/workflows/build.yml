name: NeoForge Build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        integration:
          - name: player-bridge
            working-directory: .
            artifact-path: build/libs/*.jar
          - name: permission-integration
            working-directory: mods/ivrm-permission-integration
            artifact-path: mods/ivrm-permission-integration/build/libs/*.jar

    name: Build ${{ matrix.integration.name }}

    steps:
      - name: ソースを取得
        uses: actions/checkout@v6

      - name: Java 25をセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 9.2.1をセットアップ
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic

      - name: ビルド
        working-directory: ${{ matrix.integration.working-directory }}
        run: gradle --no-daemon clean build

      - name: ビルド成果物を保存
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ivrm-${{ matrix.integration.name }}-${{ github.sha }}
          path: ${{ matrix.integration.artifact-path }}
          if-no-files-found: error
          retention-days: 14
